<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 乒乓球高手 - Ping Pong Master</title>
    <link rel="stylesheet" href="index.css">
    <script type="importmap">
        {
            "imports": {
                "three": "./lib/three/three.module.js",
                "three/examples/jsm/postprocessing/": "https://unpkg.com/three@0.147.0/examples/jsm/postprocessing/",
                "three/examples/jsm/shaders/": "https://unpkg.com/three@0.147.0/examples/jsm/shaders/",
                "three/examples/jsm/": "./lib/three/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui-overlay">
        <div id="scoreboard">
            <div class="score-card">
                <img src="assets/flags/cn.png" class="flag" id="player-flag">
                <span id="player-score">0</span>
            </div>
            <div class="score-divider">:</div>
            <div class="score-card">
                <span id="ai-score">0</span>
                <img src="assets/flags/la.png" class="flag" id="ai-flag">
            </div>
        </div>

        <div id="controls-hint">
            移动控制 | 空格发球 | 左键后仰(挑球) | 右键前倾(下压) | 快速上划击球
        </div>

        <div id="scoreboard" style="position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-size: 64px; color: white; font-weight: bold; text-shadow: 2px 2px 8px rgba(0,0,0,0.8); z-index: 10; font-family: 'Inter', sans-serif; display: flex; gap: 40px;">
            <span id="score-player" style="color: #00aaff;">0</span>
            <span>:</span>
            <span id="score-ai" style="color: #ff3366;">0</span>
        </div>
        
        <div id="game-message" style="position: absolute; top: 120px; left: 50%; transform: translateX(-50%); font-size: 32px; color: #ffcc00; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); z-index: 10; font-family: 'Inter', sans-serif; opacity: 0; transition: opacity 0.3s ease;">
            PLAYER SCORES!
        </div>

        <div id="top-actions">
            <button id="btn-pause" class="icon-btn">⏸</button>
            <button id="btn-sound" class="icon-btn">🔊</button>
        </div>
    </div>

    <div id="loading-screen">
        <div class="loader"></div>
        <p>正在进入赛场...</p>
    </div>

    <script src="./lib/cannon.min.js"></script>
    <script type="module" src="./js/index.js"></script>
</body>
</html>
